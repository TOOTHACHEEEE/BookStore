spring.application.name=bookstore-backend

# MySQL datasource configuration
# createDatabaseIfNotExist=true 让连接器在 bookstore 库不存在时自动创建
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 配置
# 表结构交由 schema.sql 维护，Hibernate 不参与建表
spring.jpa.hibernate.ddl-auto=none
# 关闭 SQL 明细，避免终端被大量 SQL 日志淹没
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 每次启动都执行 schema.sql：建表并插入初始书籍
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# 让 schema.sql 在 JPA 初始化之后再执行，避免顺序问题
spring.jpa.defer-datasource-initialization=true

# Server port
server.port=8080

# Logging
# 只保留业务日志，关闭 SQL / 参数绑定噪音
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.bookstore.backend=INFO
# 控制台与文件日志统一为 UTF-8，避免 Windows 终端中文乱码
logging.charset.console=UTF-8
logging.charset.file=UTF-8
# 精简控制台前缀，突出 ReAct 过程
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{0} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
# 同步写入日志文件，终端乱码时可直接用 VS Code 打开该文件展示
logging.file.name=logs/bookstore.log
# 日志滚动：单文件最大 512KB，保留 3 天，当前文件 + 历史归档总量约 1MB，启动时清理过期文件
logging.logback.rollingpolicy.max-file-size=512KB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=512KB
logging.logback.rollingpolicy.clean-history-on-start=true
# 关闭 Spring Boot 启动 banner，减少无关输出
spring.main.banner-mode=off

# ============ 作业2：智能客服助手（DeepSeek Function Calling）============
# API Key 只从环境变量 DEEPSEEK_API_KEY 读取，不要把真实密钥写进仓库
# 设置方式（PowerShell）：$env:DEEPSEEK_API_KEY="sk-你的密钥"
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat
# 单次 Function Calling 循环的最大轮数，防止模型无限调用工具
deepseek.max-tool-rounds=5

# ============ 作业3：导购 Agent（ReAct 循环）============
# 单次对话允许的最大 ReAct 步数（每次 Action 算一步），防止模型无限循环
agent.max-steps=6
# ReAct 需要稳定的格式输出，温度调低
agent.temperature=0.2

# ============ 作业3：政策知识库 RAG ============
# 政策文档位置（classpath 相对路径）
policy.rag.location=classpath:policy/store-policy.md
# 切片长度（字符）与相邻切片的重叠长度
policy.rag.chunk-size=260
policy.rag.chunk-overlap=60
# 哈希向量维度
policy.rag.dimension=1024
# 默认返回 Top-K 条款
policy.rag.top-k=3
# 低于该得分的切片不返回
policy.rag.min-score=0.05
